# arXiv 검색 쿼리 (양자 컴퓨터 제외, AI/ML 중심)
arxiv_query: "cat:cs.AI OR cat:cs.LG OR cat:cs.CL OR cat:cs.CV OR cat:cs.RO OR cat:cs.CR OR cat:cs.DC"
arxiv_max_results: 15

# 필터링 설정
max_filtered_items: 20
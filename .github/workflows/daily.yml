name: Daily AI News Curator

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 자정 (UTC) 실행
  workflow_dispatch:  # 수동 실행 가능

jobs:
  run-curator:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create .env file
      run: |
        echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env
        echo "NOTION_INTEGRATION_SECRET=${{ secrets.NOTION_INTEGRATION_SECRET }}" >> .env
        echo "NOTION_DATABASE_ID=${{ secrets.NOTION_DATABASE_ID }}" >> .env
        echo "NOTION_SOURCE_DATABASE_ID=${{ secrets.NOTION_SOURCE_DATABASE_ID }}" >> .env
        echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
        echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env
    
    - name: Run AI News Curator
      run: python -m src.main
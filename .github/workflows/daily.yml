name: Daily AI News Curator

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 자정 (UTC) 실행
  workflow_dispatch:  # 수동 실행 가능

jobs:
  run-curator:
    runs-on: ubuntu-latest
    environment: OPENAI_API_KEY
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Debug Notion Connection
      env:
        NOTION_INTEGRATION_SECRET: ${{ secrets.NOTION_INTEGRATION_SECRET }}
        NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      run: |
        echo "🔍 Notion 환경변수 디버깅:"
        echo "NOTION_INTEGRATION_SECRET: ${NOTION_INTEGRATION_SECRET:0:10}..."
        echo "NOTION_DATABASE_ID: $NOTION_DATABASE_ID"
        python debug_notion.py
    
    - name: Run AI News Curator
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        NOTION_INTEGRATION_SECRET: ${{ secrets.NOTION_INTEGRATION_SECRET }}
        NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        NOTION_SOURCE_DATABASE_ID: ${{ secrets.NOTION_SOURCE_DATABASE_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python -m src.main